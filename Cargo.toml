[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexparlett/cairn"

[workspace.dependencies]
cairn-model = { path = "crates/cairn-model" }
cairn-git = { path = "crates/cairn-git" }
cairn-ui = { path = "crates/cairn-ui" }
cairn-askpass = { path = "crates/cairn-askpass" }

# Our fork, pinned by commit. To test a fork change, patch this git source to a
# local clone at the foot of this file; never merge with the patch in place.
freya = { git = "https://github.com/alexparlett/freya", rev = "caa46f8715744cb4fdb2d36304e2b1bbeb4acdb0" }
# Headless component tests; same source and rev as `freya`, so both link one freya-core.
freya-testing = { git = "https://github.com/alexparlett/freya", rev = "caa46f8715744cb4fdb2d36304e2b1bbeb4acdb0" }
# Default features stay ON: gix's `default` carries the sha1 backend, without
# which gix-hash compiles to an empty `Kind` enum and the whole tree fails to
# build. The extras below are the surfaces a git client actually reads; `sha256`
# is what lets gix open a repository made with `--object-format=sha256`.
gix = { version = "0.87.1", features = ["blame", "blob-diff", "revision", "status", "max-performance", "parallel", "sha256"] }
thiserror = "2"
# Sends SIGTERM to a git child on cancel, from safe code: `std` can only
# SIGKILL, and git removes its lock files on SIGTERM alone (issue #19).
# `signal` is the `kill(2)` wrapper, `process` the `Pid` it takes. `process`
# also compiles `posix_spawn` and the `exec` family, which the terminal-prompt
# guard forbids by spelling so no process can start without `GitEnvironment`.
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
# Zeroes credential buffers on drop with writes the compiler may not remove
# (credential-prompts L11). `alloc` is the `Vec` impl; nothing else is used.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
