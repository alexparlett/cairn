[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexparlett/cairn"

[workspace.dependencies]
cairn-model = { path = "crates/cairn-model" }
cairn-git = { path = "crates/cairn-git" }
cairn-ui = { path = "crates/cairn-ui" }

# Freya (Skia/native GUI) — our fork, pinned by commit. Cairn tracks the same rev
# the other Freya projects in this tree do, so a fix made once in the fork is a
# fix everywhere rather than a patch per consumer.
#
# While a fork change is in flight, point the git source at a local clone with a
# `[patch."https://github.com/alexparlett/freya"]` block at the foot of this file
# rather than editing this line — one override, and the rev here stays the thing
# that ships. Remove the patch before merging: a patch naming a path only one
# machine has is a build nobody else can reproduce.
freya = { git = "https://github.com/alexparlett/freya", rev = "caa46f8715744cb4fdb2d36304e2b1bbeb4acdb0" }
# Default features stay ON: gix's `default` carries the sha1 backend, without
# which gix-hash compiles to an empty `Kind` enum and the whole tree fails to
# build. The extras below are the surfaces a git client actually reads.
gix = { version = "0.87.1", features = ["blame", "blob-diff", "revision", "status", "max-performance", "parallel"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
