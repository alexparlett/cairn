[package]
name = "cairn-git"
description = "Cairn's repository engine: gitoxide-backed queries and commands over cairn-model types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Cairn ships as an application, not as crates. Nothing here is published, which
# is also what lets the internal path dependencies carry no version requirement.
publish = false

[dependencies]
cairn-model.workspace = true
gix.workspace = true
nix.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The engine's fetch tests answer a real askpass channel from a test thread; the
# engine itself never links the helper (its allowlist row has no such entry).
cairn-askpass.workspace = true

[lints]
workspace = true
