[package]
name = "cairn-ui"
description = "Cairn's Freya component library. Renders cairn-model types; never reaches a repository itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Cairn ships as an application, not as crates. Nothing here is published, which
# is also what lets the internal path dependencies carry no version requirement.
publish = false

[dependencies]
cairn-model.workspace = true
# `engine` exposes Skia for painting the graph column; no new crate.
freya = { workspace = true, features = ["engine"] }
# Terminal column widths for tab stops (`src/columns.rs`; user-approved 2026-10-03).
unicode-width.workspace = true
# The edge auto-scroll's timer (`src/edge_scroll.rs`; user-approved 2026-10-07, L5).
async-io.workspace = true

[dev-dependencies]
freya-testing.workspace = true

[lints]
workspace = true
