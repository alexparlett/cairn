[package]
name = "cairn-ui"
description = "Cairn's Freya component library. Renders cairn-model types; never reaches a repository itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Cairn ships as an application, not as crates. Nothing here is published, which
# is also what lets the internal path dependencies carry no version requirement.
publish = false

[dependencies]
cairn-model.workspace = true
# `engine` re-exports `freya-engine` (Skia) so the graph column can be painted
# rather than assembled out of rectangles: a bent line has to be a curve, and a
# rect-per-segment row is a dozen laid-out elements where a canvas is one. It is
# a feature of a dependency Cairn already has and pulls in no new crate —
# `freya-engine` is already linked, this only lets us name its types.
freya = { workspace = true, features = ["engine"] }

[lints]
workspace = true
