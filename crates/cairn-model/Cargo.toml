[package]
name = "cairn-model"
description = "Boundary vocabulary shared by Cairn's git engine and its UI. Depends on neither."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Cairn ships as an application, not as crates. Nothing here is published, which
# is also what lets the internal path dependencies carry no version requirement.
publish = false

[dependencies]
# The one dependency (decision L11 of credential-prompts): volatile zeroing
# of a credential on drop, which a hand-rolled loop cannot promise.
zeroize.workspace = true

[lints]
workspace = true
